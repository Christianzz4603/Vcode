[package]
name = "vcode_disasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Library inspector and ARM64 disassembler for Vcode"
publish = false

[lib]
name = "vcode_disasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
yaxpeax-arch = { version = "0.3.3", default-features = false }
yaxpeax-arm = { version = "0.5.0", default-features = false, features = ["std", "alloc", "fmt"] }
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "std"] }
cpp_demangle = "0.4"
rustc-demangle = "0.1"
jni = "0.21"
ghidra-decompiler = { git = "https://github.com/Christianzz4603/ghidra-decompiler", rev = "dd2b77f916e8f0de9e505094c9e525f2314ce3ad", default-features = false, features = ["mobile"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 8
strip = true
debug = false
